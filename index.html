<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo geocerca</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #panel { padding: 10px; background: #f4f4f4; font-size: 15px; }
  #estado { font-weight: bold; margin: 6px 0; }
  .dentro { color: #0a7a2f; }
  .fuera { color: #b00020; }
  #map { height: calc(100% - 150px); }
  button { padding: 8px 12px; font-size: 15px; }
</style>
</head>
<body>
<div id="panel">
  <div id="titulo">Cargando...</div>
  <div id="estado">Esperando ubicación...</div>
  <div id="detalle"></div>
  <label><input type="checkbox" id="sim"> Modo ensayo: tocá el mapa para simular tu ubicación</label>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Todo lo que depende del lugar viene de config.json. Nada de coordenadas acá.

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

fetch('config.json').then(r => r.json()).then(cfg => {
  document.getElementById('titulo').textContent = cfg.juego.nombre;
  const map = L.map('map').setView([cfg.juego.centro.lat, cfg.juego.centro.lng], 18);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  cfg.puntos.forEach(p => {
    L.circle([p.lat, p.lng], { radius: p.radioM, color: '#1565c0', fillOpacity: 0.15 })
      .addTo(map).bindTooltip(p.nombre);
  });

  let yo = null;
  const estado = document.getElementById('estado');
  const detalle = document.getElementById('detalle');
  const sim = document.getElementById('sim');

  function actualizar(lat, lng, precision) {
    if (!yo) yo = L.circleMarker([lat, lng], { radius: 8, color: '#d81b60' }).addTo(map);
    yo.setLatLng([lat, lng]);
    let cercano = null;
    cfg.puntos.forEach(p => {
      const d = haversine(lat, lng, p.lat, p.lng);
      if (!cercano || d < cercano.d) cercano = { p, d };
    });
    const dentro = cercano.d <= cercano.p.radioM;
    estado.textContent = dentro ? 'DENTRO de la geocerca: ' + cercano.p.nombre
                                : 'Fuera de la geocerca';
    estado.className = dentro ? 'dentro' : 'fuera';
    detalle.textContent = 'Punto más cercano: ' + cercano.p.nombre + ' a ' + Math.round(cercano.d) +
      ' m (radio ' + cercano.p.radioM + ' m)' +
      (precision ? ' | precisión GPS: ±' + Math.round(precision) + ' m' : '');
  }

  map.on('click', e => { if (sim.checked) actualizar(e.latlng.lat, e.latlng.lng, null); });

  if (!navigator.geolocation) {
    estado.textContent = 'Este navegador no soporta geolocalización';
    return;
  }
  navigator.geolocation.watchPosition(
    pos => { if (!sim.checked) actualizar(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); },
    err => { estado.textContent = 'No se pudo obtener la ubicación (' + err.message + '). Revisá los permisos.'; },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}).catch(() => {
  document.getElementById('titulo').textContent =
    'No se pudo leer config.json (hay que abrir la página desde la URL de GitHub Pages, no como archivo).';
});
</script>
</body>
</html>
